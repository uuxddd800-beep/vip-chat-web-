<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>VIP Messenger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;height:100vh;overflow:hidden;touch-action:pan-y;transition:background .3s}
.screen{display:none;height:100vh;width:100%;position:relative}
.screen.active{display:block}
.screen.active:not(#screenChat){animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.auth-box{padding:30px;background:#007aff;color:#fff;height:100%;display:flex;flex-direction:column;justify-content:center}
.auth-box input{padding:15px;margin-bottom:10px;border-radius:10px;border:none;width:100%}
.auth-box .btn{display:block;text-align:center;padding:15px;border-radius:10px;background:#fff;color:#007aff;font-weight:bold;width:100%;margin-top:10px;cursor:pointer;text-decoration:none}
.header,.chat-header{background:#007aff;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:absolute;top:0;left:0;width:100%;height:60px;z-index:10}
.header h2{font-size:18px}
.header a,.chat-header a{color:#fff;text-decoration:none;cursor:pointer}
.search-bar{position:absolute;top:60px;left:0;width:100%;padding:10px;background:#fff;z-index:9;border-bottom:1px solid #ddd}
.search-bar input{width:100%;padding:10px;border-radius:20px;border:1px solid #ccc;outline:none}
.chat-list{position:absolute;top:115px;bottom:0;left:0;width:100%;overflow-y:auto;background:#fff}
.chat-item{display:flex;align-items:center;padding:15px;border-bottom:1px solid #eee;cursor:pointer;transition:background .1s}
.chat-item:active{background:#f9f9f9}
.avatar{width:50px;height:50px;border-radius:50%;background:#ccc;margin-right:15px;object-fit:cover}
.chat-name{font-weight:bold;font-size:16px;color:#333}
.chat-tag{font-size:12px;color:#888}

/* ДОБАВИЛ ОТСТУП СНИЗУ (padding-bottom: 60px) */
.chat-messages{position:absolute;top:60px;bottom:60px;left:0;width:100%;overflow-y:auto;padding:15px 15px 60px 15px;background:#e5ddd5;overscroll-behavior:contain;}

.msg{max-width:80%;padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px;position:relative;word-wrap:break-word}
.msg.my{background:#dcf8c6;margin-left:auto;color:#000;border-bottom-right-radius:2px}
.msg.other{background:#fff;margin-right:auto;color:#000;border-bottom-left-radius:2px}
.msg-time{font-size:10px;color:#888;text-align:right;margin-top:4px;display:block}
#scrollBottomBtn{position:fixed;bottom:75px;right:20px;width:45px;height:45px;background:#007aff;color:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:99;cursor:pointer;animation:pop .3s}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.chat-input{position:fixed;bottom:0;left:0;width:100%;height:60px;background:#f0f0f0;display:flex;align-items:center;padding:10px;border-top:1px solid #ddd;z-index:100;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.chat-input input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc;outline:none}
.chat-input a.btn{display:inline-block;background:#007aff;color:#fff;padding:0 20px;height:40px;line-height:40px;border-radius:20px;margin-left:10px;font-weight:bold;cursor:pointer;text-decoration:none}
.settings-menu{position:absolute;top:60px;bottom:0;left:0;width:100%;padding:20px;overflow-y:auto;background:#fff;text-align:center}
.profile-header{margin-bottom:30px}
.profile-avatar{width:100px;height:100px;border-radius:50%;margin:0 auto 15px;object-fit:cover;background:#ddd;border:2px solid #007aff}
.profile-name{font-size:22px;font-weight:bold;margin-bottom:5px}
.profile-tag{color:#888;font-size:14px;margin-bottom:20px}
.settings-item{margin-bottom:20px;text-align:left}
.settings-item label{display:block;margin-bottom:5px;color:#666}
.settings-item input,.settings-item select{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc}
.btn-save,.btn-logout,.btn-delete{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;margin-bottom:10px;cursor:pointer;display:block;text-align:center;text-decoration:none;color:#fff}
.btn-save{background:#4cd964}.btn-logout{background:#ff9500}.btn-delete{background:#ff3b30}
body.theme-telegram{background:#f0f2f5}body.theme-telegram .header,body.theme-telegram .chat-header{background:#007aff;color:#fff}body.theme-telegram .msg.my{background:#dcf8c6}body.theme-telegram .search-bar,body.theme-telegram .chat-list,body.theme-telegram .settings-menu{background:#fff}body.theme-telegram .chat-name{color:#333}
body.theme-dark{background:#121212}body.theme-dark .header,body.theme-dark .chat-header{background:#1f1f1f;color:#fff;border-bottom:1px solid #333}body.theme-dark .chat-list,body.theme-dark .search-bar,body.theme-dark .settings-menu{background:#1f1f1f;color:#fff}body.theme-dark .chat-name{color:#fff}body.theme-dark .chat-messages{background:#121212}body.theme-dark .msg.my{background:#005c4b;color:#fff}body.theme-dark .msg.other{background:#202c33;color:#fff}body.theme-dark .chat-input{background:#1f1f1f;border-top:1px solid #333}body.theme-dark .chat-input input{background:#2a2a2a;color:#fff;border-color:#444}
</style>
</head>
<body class="theme-telegram">
<div id="screenAuth" class="screen active">
<div class="auth-box">
<h1 style="text-align:center;margin-bottom:20px">VIP Messenger</h1>
<input type="text" id="usernameInput" placeholder="Никнейм">
<input type="password" id="passwordInput" placeholder="Пароль">
<a href="#" class="btn" onclick="doAuth();return false">Войти</a>
<div style="text-align:center;margin-top:15px;text-decoration:underline;cursor:pointer" id="authToggle" onclick="toggleMode()">У меня нет аккаунта (Регистрация)</div>
<div id="errorText" style="color:#ff0;text-align:center;margin-top:10px"></div>
</div></div>
<div id="screenChats" class="screen">
<div class="header"><h2>Чаты</h2><div><span id="myTag" style="font-size:12px;margin-right:10px"></span><a onclick="showScreen('screenSettings')">⚙️</a></div></div>
<div class="search-bar"><input type="text" id="searchInput" placeholder="Поиск по тегу (@...)" oninput="doSearch()"></div>
<div class="chat-list" id="chatList"></div></div>
<div id="screenChat" class="screen">
<div class="chat-header"><a onclick="closeChat()" style="font-size:24px;margin-right:15px">←</a><div><div id="chatTitle" style="font-weight:bold">Чат</div><div id="chatSubtitle" style="font-size:10px"></div></div></div>
<div class="chat-messages" id="chatMessages"></div>
<div id="scrollBottomBtn" onclick="scrollToBottom()">⬇️</div>
<div class="chat-input"><input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')doSend()"><a href="#" class="btn" onclick="doSend();return false">➤</a></div></div>
<div id="screenSettings" class="screen">
<div class="header"><h2>Настройки</h2><a onclick="showScreen('screenChats')">Назад</a></div>
<div class="settings-menu">
<div class="profile-header"><img id="profileAvatarImg" class="profile-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><div id="profileNameText" class="profile-name">Никнейм</div><div id="profileTagText" class="profile-tag">@00000000</div></div>
<div class="settings-item"><label>Изменить аватар (URL)</label><input type="text" id="settingsAvatar"></div>
<div class="settings-item"><label>Изменить никнейм</label><input type="text" id="settingsName"></div>
<div class="settings-item"><label>Тема</label><select id="settingsTheme" onchange="changeTheme(this.value)"><option value="theme-telegram">Telegram</option><option value="theme-dark">Тёмная тема</option></select></div>
<a href="#" class="btn-save" onclick="doSaveProfile();return false">Сохранить</a>
<a href="#" class="btn-logout" onclick="logout();return false">Выйти</a>
<a href="#" class="btn-delete" onclick="deleteAccount();return false">Удалить аккаунт</a>
</div></div>
<script>
var SUPABASE_URL='https://rghhdvtgnpksyhfwvtug.supabase.co';
var SUPABASE_KEY='sb_publishable_LifRt-nZPcpKhN-Zrtp_AA_ujEejv_U';
var currentUser=null,currentChatId=null,isRegistering=false,allUsers=[],pollInterval=null,lastMessageCount=0;
if("Notification" in window)Notification.requestPermission();
async function sbFetch(table,method,body,query){
var url=SUPABASE_URL+'/rest/v1/'+table+(query?'?'+query:'');
var headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
if(method==='POST'||method==='PATCH')headers['Prefer']='return=representation';
var options={method:method,headers:headers};
if(body)options.body=JSON.stringify(body);
var res=await fetch(url,options);
if(!res.ok){var errText=await res.text();throw new Error('HTTP '+res.status+': '+errText)}
if(res.status===204)return null;
var text=await res.text();
if(!text||text==='null')return null;
try{return JSON.parse(text)}catch(e){throw new Error('Ошибка JSON')}
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function toggleMode(){isRegistering=!isRegistering;document.querySelector('.auth-box .btn').innerText=isRegistering?'Зарегистрироваться':'Войти';document.getElementById('authToggle').innerText=isRegistering?'У меня уже есть аккаунт':'У меня нет аккаунта (Регистрация)'}
async function doAuth(){
var user=document.getElementById('usernameInput').value.trim(),pass=document.getElementById('passwordInput').value.trim(),err=document.getElementById('errorText');
if(!user||!pass){err.innerText='Заполни все поля!';return}
err.innerText='Подожди...';
try{
if(isRegistering){
var check=await sbFetch('users','GET',null,'username=eq.'+user);
if(check&&check.length>0){err.innerText='Никнейм занят!';return}
var tag='@'+Math.floor(10000000+Math.random()*90000000);
await sbFetch('users','POST',[{username:user,password:pass,tag:tag,avatar:'',theme:'theme-telegram',is_online:true}]);
await sbFetch('chats','POST',[{id:user+'_'+user,type:'favorite'}]);
loginSuccess(user,tag,'','theme-telegram');
}else{
var res=await sbFetch('users','GET',null,'username=eq.'+user);
if(!res||res.length===0){err.innerText='Пользователь не найден!';return}
if(res[0].password!==pass){err.innerText='Неверный пароль!';return}
await sbFetch('users','PATCH',{is_online:true},'username=eq.'+user);
loginSuccess(res[0].username,res[0].tag,res[0].avatar,res[0].theme)
}
}catch(e){err.innerText='Ошибка: '+e.message}
}
function loginSuccess(username,tag,avatar,theme){
currentUser={username,tag,avatar,theme};
document.body.className=theme||'theme-telegram';
document.getElementById('myTag').innerText=tag;
document.getElementById('profileNameText').innerText=username;
document.getElementById('profileTagText').innerText=tag;
document.getElementById('profileAvatarImg').src=avatar||'https://cdn-icons-png.flaticon.com/512/149/149071.png';
document.getElementById('settingsName').value=username;
document.getElementById('settingsAvatar').value=avatar;
document.getElementById('settingsTheme').value=theme||'theme-telegram';
showScreen('screenChats');loadChats()
}
async function logout(){if(currentUser)await sbFetch('users','PATCH',{is_online:false},'username=eq.'+currentUser.username);location.reload()}
async function deleteAccount(){if(!confirm('Удалить аккаунт?'))return;await sbFetch('messages','DELETE',null,'sender=eq.'+currentUser.username);await sbFetch('users','DELETE',null,'username=eq.'+currentUser.username);location.reload()}
async function loadChats(){
if(!currentUser)return;
var list=document.getElementById('chatList');list.innerHTML='';
var fav=document.createElement('div');fav.className='chat-item';
fav.innerHTML='<div class="avatar" style="background:#ffcc00;display:flex;justify-content:center;align-items:center;">⭐</div><div class="chat-info"><div class="chat-name">Избранное</div><div class="chat-tag">Заметки</div></div>';
fav.onclick=()=>openChat('Избранное','Личное',currentUser.username+'_'+currentUser.username);
list.appendChild(fav);
var res=await sbFetch('users','GET');allUsers=res||[];renderUsers(allUsers)
}
function renderUsers(users){
var list=document.getElementById('chatList');
while(list.children.length>1)list.removeChild(list.lastChild);
users.forEach(u=>{
if(u.username!==currentUser.username){
var status=u.is_online?'🟢 В сети':'⚪ Не в сети';
var div=document.createElement('div');div.className='chat-item';
div.innerHTML='<img class="avatar" src="'+(u.avatar||'https://cdn-icons-png.flaticon.com/512/149/149071.png')+'"><div class="chat-info"><div class="chat-name">'+u.username+'</div><div class="chat-tag">'+(u.tag||'')+' • '+status+'</div></div>';
div.onclick=()=>{var chatId=[currentUser.username,u.username].sort().join('_');openChat(u.username,u.tag||'',chatId)};
list.appendChild(div)
}})
}
function doSearch(){var q=document.getElementById('searchInput').value.toLowerCase();if(!q){renderUsers(allUsers);return}var filtered=allUsers.filter(u=>(u.tag&&u.tag.toLowerCase().includes(q))||u.username.toLowerCase().includes(q));renderUsers(filtered)}
function openChat(name,tag,chatId){
currentChatId=chatId;
document.getElementById('chatTitle').innerText=name;
document.getElementById('chatSubtitle').innerText=tag||'Личное';
showScreen('screenChat');
lastMessageCount=0;loadMessages(chatId,true);
if(pollInterval)clearInterval(pollInterval);
pollInterval=setInterval(()=>loadMessages(chatId,false),2000)
}
function closeChat(){if(pollInterval){clearInterval(pollInterval);pollInterval=null}showScreen('screenChats')}
function scrollToBottom(){var box=document.getElementById('chatMessages');box.scrollTop=box.scrollHeight;document.getElementById('scrollBottomBtn').style.display='none'}
async function loadMessages(chatId,isNewChat){
var box=document.getElementById('chatMessages');
var res=await sbFetch('messages','GET',null,'chat_id=eq.'+chatId+'&order=created_at.asc');
if(!res)return;
if(!isNewChat&&res.length>lastMessageCount&&lastMessageCount>0){
var newMsg=res[res.length-1];
if(newMsg.sender!==currentUser.username&&document.hidden){
if(Notification.permission==="granted")new Notification("Новое сообщение от "+document.getElementById('chatTitle').innerText,{body:newMsg.text})
}}
lastMessageCount=res.length;
var isAtBottom=box.scrollHeight-box.scrollTop-box.clientHeight<50;
box.innerHTML='';
res.forEach(m=>{
var div=document.createElement('div');
div.className='msg '+(m.sender===currentUser.username?'my':'other');
div.innerHTML=m.text+'<span class="msg-time">'+formatTime(m.created_at)+'</span>';
box.appendChild(div)
});
if(isAtBottom||isNewChat){box.scrollTop=box.scrollHeight}else{document.getElementById('scrollBottomBtn').style.display='flex'}
}
function formatTime(t){if(!t)return'';var d=new Date(t);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
async function doSend(){
var input=document.getElementById('messageInput'),text=input.value.trim();
if(!text)return;
input.value='';
await sbFetch('messages','POST',[{chat_id:currentChatId,sender:currentUser.username,text}]);
loadMessages(currentChatId,true);scrollToBottom()
}
function changeTheme(theme){document.body.className=theme}
async function doSaveProfile(){
var name=document.getElementById('settingsName').value.trim(),avatar=document.getElementById('settingsAvatar').value.trim(),theme=document.getElementById('settingsTheme').value;
if(!name){alert('Никнейм пустой');return}
document.body.className=theme;
await sbFetch('users','PATCH',{username:name,avatar,theme},'username=eq.'+currentUser.username);
currentUser.username=name;currentUser.avatar=avatar;currentUser.theme=theme;
alert('Сохранено!');showScreen('screenChats');loadChats()
}
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, { passive: true });
document.addEventListener('touchend', e => {
    let touchEndX = e.changedTouches[0].screenX;
    let touchEndY = e.changedTouches[0].screenY;
    let dx = touchEndX - touchStartX;
    let dy = touchEndY - touchStartY;
    if (Math.abs(dy) > 30) return;
    if (Math.abs(dx) > 100) {
        if (dx > 0 && document.getElementById('screenChat').classList.contains('active')) closeChat();
        if (dx < 0 && document.getElementById('screenChats').classList.contains('active')) showScreen('screenSettings');
    }
}, { passive: true });
</script>
</body>
</html>
